services:
  mercado-chat:
    build: .
    image: mercado-central-chat:latest
    container_name: mercado-central-chat
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Monta o banco vetorial real da VM dentro do container, como somente
      # leitura. Para atualizar o índice depois de rodar criar_banco.py de
      # novo, basta reiniciar o container (docker compose restart) — não
      # precisa rebuildar a imagem.
      - ./banco_faiss:/app/banco_faiss:ro
